schema_version: 1

context:
  name: opentelemetry-instrumentation-mistralai
  version: "0.62.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_mistralai-${{ version }}.tar.gz
  sha256: cc8f379420b809c3f20b18a0670978a6917d720f44df2f1f2f4db220c065a1b2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.63b1
    - opentelemetry-semantic-conventions >=0.63b1
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0

tests:
  - requirements:
      run:
        - python ${{ python_min }}.*
        - mistralai >=1,<2
        - pip
    script:
      - python -c "import opentelemetry.instrumentation.mistralai"
      - pip check

about:
  summary: OpenTelemetry Mistral AI instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.traceloop.com/openllmetry
  repository: https://github.com/traceloop/openllmetry
  documentation: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
